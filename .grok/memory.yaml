memory:
  description: Governed memory contracts. Postgres primary, encrypted file fallback.

  required_fields:
    - content
    - source
    - confidence
    - scope
    - retention_days
    - write_permission
    - created_at
    - last_accessed

  optional_learning_fields:
    - feedback_score
    - feedback_count
    - tags
    - meta

  sources:
    - user_said
    - x_context
    - derived
    - system
    - distilled
    - feedback

  scopes:
    - session
    - user
    - global

  policy:
    cross_session_requires_consent: true
    default_session_retention_days: 0
    default_user_retention_days: 365
    distill_min_confidence: 0.7
    feedback_adjusts_confidence: true

  backends:
    primary: postgres
    fallback: encrypted_file
    dsn_env: AETHER_DATABASE_URL
    default_dsn: postgresql://postgres:postgres@127.0.0.1:5432/postgres
