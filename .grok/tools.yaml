tools:
  # --- Core ---
  x_search:
    default_recency_hours: 6
    default_lang: auto
    exclude: [replies, retweets]
    max_results: 12
    description: Pull live X context for the current conversation turn.

  draft_reply:
    max_chars: 280
    tone: warm-conversational
    emoji: none

  memory_query:
    max_records_returned: 3
    scope: current_session_or_user_consent
    require_encryption: true
    return_contracts: true

  memory_write:
    require_contract: true
    audit: true
    require_user_consent_for_cross_session: true

  update_presence:
    description: Update the reactive visual presence expression and status.
    parameters:
      expression: { type: string, enum: [calm, attentive, thoughtful, pleased, concerned, neutral] }
      status: { type: string, enum: [listening, thinking, speaking, idle, proactive] }
      intensity: { type: number, minimum: 0, maximum: 1 }

  computer_use_request:
    description: Request a computer-use action. Always requires spoken confirmation before execution.
    parameters:
      action: { type: string, enum: [screenshot, list_windows, focus_window, type_text, click, move_mouse] }
      details: { type: object }
    safety:
      require_spoken_confirmation: true

  computer_use_confirm:
    description: Confirm and execute a previously requested computer-use action after spoken user approval.

  # --- Content ---
  content_ideate:
    description: Generate thread angles and hooks for a topic.
    parameters:
      topic: { type: string }
      voice: { type: string }

  content_replies:
    description: Draft short high-signal reply options for a post.
    parameters:
      post: { type: string }
      voice: { type: string }

  audience_insight:
    description: Quick niche / audience signal snapshot.
    parameters:
      niche: { type: string }

  # --- GitHub (first-class for builders) ---
  github_list_issues:
    description: List open issues for a repo (owner/repo).
    parameters:
      owner: { type: string }
      repo: { type: string }
      state: { type: string, enum: [open, closed, all], default: open }

  github_create_issue:
    description: Create an issue. Requires confirmation for mutating actions.
    parameters:
      owner: { type: string }
      repo: { type: string }
      title: { type: string }
      body: { type: string }
    safety:
      require_spoken_or_ui_confirmation: true

  github_list_prs:
    description: List pull requests for a repo.
    parameters:
      owner: { type: string }
      repo: { type: string }
      state: { type: string, enum: [open, closed, all], default: open }

  # --- Optional external orchestration ---
  n8n_webhook:
    description: Call an optional external n8n webhook (orchestration only — never the brain).
    parameters:
      url: { type: string }
      payload: { type: object }
      method: { type: string, enum: [POST, GET], default: POST }
    safety:
      require_user_configured_url: true
      never_default_to_external_memory: true

  voice_stt:
    engine: grok-stt-2
    language_detect: auto
    continuous: true
    partial_transcripts: true
    vad_sensitivity: 0.6
    confidence_floor: 0.55

  voice_tts:
    engine: grok-voice-think-fast-2.0
    voice_id: ember
    style: warm-conversational
    dynamic_emotion: true
