[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.3.0"
description = "Desktop presence operating surface for high-agency builders — governed memory, Grok Voice, live X context, computer-use, action plans"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "AgentMindCloud", email = "jani@agentmindcloud.com"}
]
keywords = ["grok", "xai", "voice-agent", "multi-agent", "presence", "desktop", "electron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42.0.0"]
dev = ["pytest>=7.0", "pyyaml>=6.0", "cryptography>=42.0.0"]

[project.scripts]
aether = "aether.runtime:main"

[project.urls]
Homepage = "https://github.com/AgentMindCloud/aether"
Repository = "https://github.com/AgentMindCloud/aether"
Issues = "https://github.com/AgentMindCloud/aether/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aether = ["py.typed"]
