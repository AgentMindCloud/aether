<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel" id="app">
    <header class="panel-header">
      <div class="brand">
        <div class="logo">A</div>
        <div class="brand-text">
          <div class="title">Aether</div>
          <div class="subtitle">Presence</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="minimizeBtn" title="Hide to tray">−</button>
        <button class="icon-btn" id="closeBtn" title="Hide to tray">×</button>
      </div>
    </header>

    <section class="presence-section">
      <div class="presence-orb" id="presenceOrb">
        <div class="orb-inner" id="orbInner"></div>
      </div>
      <div class="presence-meta">
        <div class="presence-status" id="presenceStatus">idle</div>
        <div class="presence-expression" id="presenceExpression">neutral</div>
      </div>
    </section>

    <section class="capture">
      <div class="section-label">QUICK CAPTURE</div>
      <div class="capture-box">
        <input type="text" id="captureInput" placeholder="Capture a thought or next move…" />
        <button class="capture-btn" id="captureBtn">+</button>
      </div>
      <div class="capture-hint">Ctrl + Alt + A · or type and press Enter</div>
    </section>

    <section class="view active" id="priorityView">
      <div class="view-header">
        <div class="section-label">PRIORITY LIST</div>
        <button class="text-btn" id="switchToBookmarks">Bookmarks →</button>
      </div>
      <ul class="priority-list" id="priorityList"></ul>
    </section>

    <section class="view" id="bookmarkView">
      <div class="view-header">
        <div class="section-label">BOOKMARK INTELLIGENCE</div>
        <button class="text-btn" id="backToPriority">← Priority</button>
      </div>
      <ul class="bookmark-list" id="bookmarkList"></ul>
    </section>

    <section class="status-bar">
      <div class="status-item">
        <span class="dot" id="runtimeDot"></span>
        <span id="runtimeLabel">Runtime: offline</span>
      </div>
      <div class="status-item">
        <span id="sessionLabel">No active session</span>
      </div>
    </section>

    <footer class="panel-footer">
      <button class="footer-btn" id="firstUseBtn">First-use Magic</button>
      <button class="footer-btn primary" id="startSessionBtn">Start Session</button>
    </footer>
  </div>

  <!-- Make it real modal -->
  <div class="modal hidden" id="planModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="planTitle">Action Plan</h3>
        <button class="icon-btn" id="closeModal">×</button>
      </div>
      <div class="modal-body" id="planBody"></div>
      <div class="modal-footer">
        <button class="footer-btn" id="cancelPlan">Cancel</button>
        <button class="footer-btn primary" id="confirmMakeReal">Make it real →</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
