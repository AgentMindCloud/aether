<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel" id="app">
    <header class="panel-header">
      <div class="brand">
        <div class="logo">A</div>
        <div class="brand-text">
          <div class="title">Aether</div>
          <div class="subtitle" id="brandSubtitle">Presence</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="minimizeBtn" title="Hide to tray">−</button>
        <button class="icon-btn" id="closeBtn" title="Hide to tray">×</button>
      </div>
    </header>

    <!-- Presence hero -->
    <section class="presence-hero">
      <div class="orb-wrap">
        <div class="presence-orb" id="presenceOrb">
          <div class="orb-ring"></div>
          <div class="orb-inner" id="orbInner"></div>
          <div class="orb-core"></div>
        </div>
      </div>
      <div class="presence-meta">
        <div class="presence-status" id="presenceStatus">idle</div>
        <div class="presence-line" id="presenceLine">Ready when you are</div>
      </div>
    </section>

    <!-- Session transcript (first-class when active) -->
    <section class="session-panel" id="sessionPanel">
      <div class="session-header">
        <span class="section-label">SESSION</span>
        <span class="session-badge" id="sessionBadge">off</span>
      </div>
      <div class="talk-messages" id="talkMessages">
        <div class="empty-session" id="emptySession">Start a session to talk. Agent will reply and speak.</div>
      </div>
    </section>

    <!-- Talk / capture input -->
    <section class="talk-bar">
      <div class="talk-box" id="talkBox">
        <button class="mic-btn" id="micBtn" title="Hold to speak (Web Speech)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <input type="text" id="captureInput" placeholder="Capture a thought or next move…" autocomplete="off" />
        <button class="send-btn" id="captureBtn" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="talk-hint" id="captureHint">Ctrl+Alt+A · Enter to send · Mic for voice input</div>
    </section>

    <!-- Secondary: Priority / Bookmarks -->
    <section class="secondary">
      <div class="tabs">
        <button class="tab active" id="tabPriority" data-view="priority">Priority</button>
        <button class="tab" id="tabBookmarks" data-view="bookmarks">Bookmarks</button>
      </div>
      <div class="view active" id="priorityView">
        <ul class="priority-list" id="priorityList"></ul>
      </div>
      <div class="view" id="bookmarkView">
        <ul class="bookmark-list" id="bookmarkList"></ul>
      </div>
    </section>

    <section class="status-bar">
      <div class="status-item">
        <span class="dot" id="runtimeDot"></span>
        <span id="runtimeLabel">Runtime: offline</span>
      </div>
      <div class="status-item">
        <span id="sessionLabel">No active session</span>
      </div>
    </section>

    <footer class="panel-footer">
      <button class="footer-btn" id="firstUseBtn">First-use</button>
      <button class="footer-btn primary" id="startSessionBtn">Start Session</button>
    </footer>
  </div>

  <div class="modal hidden" id="planModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="planTitle">Action Plan</h3>
        <button class="icon-btn" id="closeModal">×</button>
      </div>
      <div class="modal-body" id="planBody"></div>
      <div class="modal-footer">
        <button class="footer-btn" id="cancelPlan">Cancel</button>
        <button class="footer-btn primary" id="confirmMakeReal">Make it real →</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
